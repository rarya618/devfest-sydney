# Redeploy trigger. App Hosting resolves secrets and env vars at rollout time, not build
# time, so a config change made in the console or Secret Manager needs a fresh rollout to
# be picked up, with no code change to carry it. Bump this number, commit, and push: the
# on-push rollout does the rest. (The alternative is
# `firebase apphosting:rollouts:create devfest-sydney --git-branch main`.)
# rollout: 1

runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 10
  concurrency: 80

env:
  # Firebase client SDK — safe to expose
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyCBzpQW2OjpnoMxNAnCKD4v77NUQ2dIR28
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: devfest-sydney-2026.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: devfest-sydney-2026
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: devfest-sydney-2026.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "814298543377"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:814298543377:web:08fbcb92e0c9894eb388b0
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_GA_MEASUREMENT_ID
    value: G-F2ZZ8H82BW
    availability:
      - BUILD
      - RUNTIME

  # This app's own host (stage 3 of the plan in PM.md). APP_ORIGIN switches on the redirect
  # of every non-API path on devfest.gdgsydney.com to it, query string included, so links in
  # emails already sent keep working (src/lib/siteRedirects.ts). BUILD because redirects are
  # fixed at build time. NEXT_PUBLIC_SITE_URL is what new emails, canonicals, the sitemap and
  # robots.txt link to. Set 2026-11-10, once app.gdgsydney.com was connected and allowed in
  # Firebase Auth and the reCAPTCHA key.
  - variable: APP_ORIGIN
    value: https://app.gdgsydney.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://app.gdgsydney.com
    availability:
      - BUILD
      - RUNTIME

  # Event settings (whether each form is open and until when, ticket on-sale date, the
  # Humanitix link, the lowest price) moved to the `events` collection in stage 4a
  # (2026-11-13) and are edited in /admin/events. CFS_OPEN, CFS_CLOSE_DATE,
  # NEXT_PUBLIC_HUMANITIX_URL, TICKET_LOWEST_PRICE, VOLUNTEER_OPEN and SHOWCASE_OPEN were here.

  # Firebase Admin SDK — stored as secrets
  # BUILD availability is required: Next.js executes route modules (which
  # import firebase-admin) during the "Collecting page data" build step.
  - variable: FIREBASE_PROJECT_ID
    value: devfest-sydney-2026
    availability:
      - BUILD
      - RUNTIME
  - variable: FIREBASE_CLIENT_EMAIL
    secret: FIREBASE_CLIENT_EMAIL
    availability:
      - BUILD
      - RUNTIME
  - variable: FIREBASE_PRIVATE_KEY
    secret: FIREBASE_PRIVATE_KEY
    availability:
      - BUILD
      - RUNTIME

  # Speaker acceptance confirmation links — stored as a secret
  # Signs the token in the "Confirm participation" button of the acceptance email.
  # Rotating it invalidates every confirmation link already emailed.
  - variable: SPEAKER_CONFIRM_SECRET
    secret: SPEAKER_CONFIRM_SECRET
    availability:
      - RUNTIME

  # Volunteer acceptance confirmation links — stored as a secret
  # Signs the token in the "Confirm you're coming" button of the volunteer acceptance
  # email. Separate from SPEAKER_CONFIRM_SECRET so rotating one doesn't invalidate the
  # other's links. NOTE: adding this block does not create the secret. Create it with
  # `firebase apphosting:secrets:set VOLUNTEER_CONFIRM_SECRET --project devfest-sydney-2026`
  # and grant the backend access, or the next rollout fails with "Misconfigured secret".
  - variable: VOLUNTEER_CONFIRM_SECRET
    secret: VOLUNTEER_CONFIRM_SECRET
    availability:
      - RUNTIME

  # Builder Showcase acceptance confirmation links — stored as a secret
  # Signs the token in the "Confirm your demo" button of the showcase acceptance email.
  # Separate from the speaker and volunteer secrets so rotating one doesn't invalidate the
  # others' links. NOTE: adding this block does not create the secret. Create it with
  # `firebase apphosting:secrets:set SHOWCASE_CONFIRM_SECRET --project devfest-sydney-2026`
  # and grant the backend access, or the next rollout fails with "Misconfigured secret".
  - variable: SHOWCASE_CONFIRM_SECRET
    secret: SHOWCASE_CONFIRM_SECRET
    availability:
      - RUNTIME

  # The speaker, showcase and volunteer ticket links and the volunteer WhatsApp invite moved
  # to `eventPrivate` in stage 4a (2026-11-13), set per event in /admin/events. Their Secret
  # Manager secrets (SPEAKER_TICKET_URL, SHOWCASE_TICKET_URL, VOLUNTEER_TICKET_URL,
  # VOLUNTEER_WHATSAPP_URL) are no longer read and can be deleted once 4a is live.

  # Resend — stored as secrets
  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY
    availability:
      - RUNTIME
  - variable: RESEND_FROM_EMAIL
    secret: RESEND_FROM_EMAIL
    availability:
      - RUNTIME
