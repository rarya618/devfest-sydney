# Redeploy trigger. App Hosting resolves secrets and env vars at rollout time, not build
# time, so a config change made in the console or Secret Manager needs a fresh rollout to
# be picked up, with no code change to carry it. Bump this number, commit, and push: the
# on-push rollout does the rest. (The alternative is
# `firebase apphosting:rollouts:create devfest-sydney --git-branch main`.)
# rollout: 1

runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 10
  concurrency: 80

env:
  # Firebase client SDK — safe to expose
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyCBzpQW2OjpnoMxNAnCKD4v77NUQ2dIR28
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: devfest-sydney-2026.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: devfest-sydney-2026
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: devfest-sydney-2026.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "814298543377"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:814298543377:web:08fbcb92e0c9894eb388b0
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_GA_MEASUREMENT_ID
    value: G-F2ZZ8H82BW
    availability:
      - BUILD
      - RUNTIME

  # Call for Speakers toggle
  - variable: CFS_OPEN
    value: "true"
    availability:
      - BUILD
      - RUNTIME
  - variable: CFS_CLOSE_DATE
    value: "2026-08-31T00:00:00+10:00"
    availability:
      - BUILD
      - RUNTIME

  # Tickets (Humanitix)
  # ISO datetime tickets go on sale. Sales open at that moment on their own, with no
  # deploy: the pages showing ticket CTAs render per request. Empty keeps tickets closed.
  - variable: TICKETS_ON_SALE_DATE
    value: "2026-08-31T00:00:00+10:00"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_HUMANITIX_URL
    value: https://events.humanitix.com/devfest-sydney
    availability:
      - BUILD
      - RUNTIME
  # Cheapest ticket tier on sale, AUD, excluding the booking fee. Feeds only the Event
  # JSON-LD price on /. Update when Humanitix tiers change; empty publishes no price.
  - variable: TICKET_LOWEST_PRICE
    value: "40.00"
    availability:
      - RUNTIME

  # Volunteer signup toggle
  - variable: VOLUNTEER_OPEN
    value: "true"
    availability:
      - BUILD
      - RUNTIME

  # Builder Showcase (call for demos)
  # Master switch. An optional SHOWCASE_CLOSE_DATE deadline can be added here later;
  # App Hosting rejects empty values, so "no deadline" means omitting the variable.
  - variable: SHOWCASE_OPEN
    value: "true"
    availability:
      - BUILD
      - RUNTIME

  # Firebase Admin SDK — stored as secrets
  # BUILD availability is required: Next.js executes route modules (which
  # import firebase-admin) during the "Collecting page data" build step.
  - variable: FIREBASE_PROJECT_ID
    value: devfest-sydney-2026
    availability:
      - BUILD
      - RUNTIME
  - variable: FIREBASE_CLIENT_EMAIL
    secret: FIREBASE_CLIENT_EMAIL
    availability:
      - BUILD
      - RUNTIME
  - variable: FIREBASE_PRIVATE_KEY
    secret: FIREBASE_PRIVATE_KEY
    availability:
      - BUILD
      - RUNTIME

  # Speaker acceptance confirmation links — stored as a secret
  # Signs the token in the "Confirm participation" button of the acceptance email.
  # Rotating it invalidates every confirmation link already emailed.
  - variable: SPEAKER_CONFIRM_SECRET
    secret: SPEAKER_CONFIRM_SECRET
    availability:
      - RUNTIME

  # Volunteer acceptance confirmation links — stored as a secret
  # Signs the token in the "Confirm you're coming" button of the volunteer acceptance
  # email. Separate from SPEAKER_CONFIRM_SECRET so rotating one doesn't invalidate the
  # other's links. NOTE: adding this block does not create the secret. Create it with
  # `firebase apphosting:secrets:set VOLUNTEER_CONFIRM_SECRET --project devfest-sydney-2026`
  # and grant the backend access, or the next rollout fails with "Misconfigured secret".
  - variable: VOLUNTEER_CONFIRM_SECRET
    secret: VOLUNTEER_CONFIRM_SECRET
    availability:
      - RUNTIME

  # Speaker complimentary ticket link — stored as a secret
  # The Humanitix URL carrying the speaker access code, emailed to a speaker once they
  # confirm. A secret rather than a plain value: the code unlocks free tickets, so it does
  # not belong in the repo. Unset means the admin cannot send the ticket email at all.
  - variable: SPEAKER_TICKET_URL
    secret: SPEAKER_TICKET_URL
    availability:
      - RUNTIME

  # Volunteer ticket and WhatsApp links, shown on /volunteer/confirm once a volunteer has
  # confirmed. Secrets: the ticket link carries a Humanitix access code, and the invite
  # lets anyone who holds it into the group. NOTE: adding these blocks does not create the
  # secrets. Create each with `firebase apphosting:secrets:set <NAME> --project
  # devfest-sydney-2026` and grant the backend access before the next rollout, or it fails
  # with "Misconfigured secret".
  - variable: VOLUNTEER_TICKET_URL
    secret: VOLUNTEER_TICKET_URL
    availability:
      - RUNTIME

  - variable: VOLUNTEER_WHATSAPP_URL
    secret: VOLUNTEER_WHATSAPP_URL
    availability:
      - RUNTIME

  # Resend — stored as secrets
  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY
    availability:
      - RUNTIME
  - variable: RESEND_FROM_EMAIL
    secret: RESEND_FROM_EMAIL
    availability:
      - RUNTIME
